<title>Onderhoud - InlineComp</title>
<style>
  :root {
    --navy: #1c4a6e;
    --navy-dark: #12324b;
    --orange: #e8720f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: #ffffff;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 96px;
    height: 96px;
    margin-bottom: 32px;
    border-radius: 22px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.82);
    margin: 0 0 8px;
  }
  .bar {
    width: 64px;
    height: 5px;
    border-radius: 3px;
    background: var(--orange);
    margin: 24px auto;
  }
  .spinner {
    width: 22px;
    height: 22px;
    margin: 28px auto 0;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footnote {
    margin-top: 36px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
